name: Live production browser QA

on:
  workflow_run:
    workflows: ["Deploy RIPPLE BD to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  live-browser-qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full suite against live GitHub Pages
        run: npx playwright test -c playwright.live.config.ts

      - name: Upload live Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: |
            playwright-live-report/
            test-results/
          if-no-files-found: ignore
